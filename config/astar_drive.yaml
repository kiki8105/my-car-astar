astar_drive:
  ros__parameters:
    # 첫 번째 페이지의 Pure Pursuit 예제 기본값
    lookahead_distance: 0.5
    linear_velocity: 0.1
    goal_tolerance: 0.2
    max_angular_velocity: 1.0

    # OccupancyGrid에서 이 값 이상인 셀은 A*가 통과하지 않습니다.
    occupied_threshold: 50
    # 차체 반경과 여유를 포함해 점유 셀 주변 경로도 차단합니다.
    robot_radius: 0.2

    # 지도상 자유 공간에서 새로 발견된 전방 장애물만 안전 정지합니다.
    obstacle_stop_distance: 0.45
    obstacle_front_angle: 0.35
    scan_timeout: 1.0

    # TurtleBot3 Waffle Pi Gazebo 카메라 이미지 토픽
    image_topic: /camera/image_raw
    yolo_model: yolov8n.pt
    confidence_threshold: 0.7
    stop_class: person
    show_detection: true

    # 카메라 또는 YOLO 모델을 사용할 수 없으면 주행하지 않습니다.
    require_detector: true
    control_period: 0.1
